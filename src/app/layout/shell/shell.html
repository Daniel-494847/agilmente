<div
  class="d-flex flex-column flex-lg-row min-vh-100"
  [class.game-active]="jugando()"
>
  <app-sidebar />

  <div class="flex-grow-1 d-flex flex-column min-w-0">
    @if (isAuthenticated() && !jugando()) {
      <app-topbar [usuario]="usuario()" />
    }

    <main class="flex-grow-1">
      <router-outlet />
    </main>
  </div>
</div>
