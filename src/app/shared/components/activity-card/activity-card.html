<a
  class="card h-100 text-decoration-none border-2 rounded-4 p-3 position-relative d-flex flex-column"
  [class]="clasesTema()"
  [routerLink]="actividad.ruta"
  [attr.aria-label]="'Comenzar actividad ' + actividad.titulo"
>
  <span class="badge rounded-circle position-absolute top-0 start-0 translate-middle-y ms-3 bg-primary text-white d-flex align-items-center justify-content-center" style="width: 26px; height: 26px; font-size: 13px">
    {{ numero }}
  </span>

  @if (actividad.imagen) {
    <img
      class="mb-2 rounded"
      [src]="actividad.imagen"
      [alt]="actividad.titulo"
      width="73"
      height="73"
      style="object-fit: contain"
      loading="lazy"
    />
  } @else {
    <i class="bi {{ actividad.icono }} display-5 mb-2" aria-hidden="true"></i>
  }

  <h3 class="fs-6 fw-bold mb-1">{{ actividad.titulo }}</h3>
  <p class="text-secondary small mb-3" style="min-height: 34px">{{ actividad.descripcion }}</p>

  <div class="d-flex gap-2 mt-auto">
    <span class="btn btn-sm rounded-pill align-self-start px-3 fw-bold text-white" [class]="claseBoton()">
      Jugar
    </span>

    @if (esDocente()) {
      <button
        type="button"
        class="btn btn-sm rounded-pill px-3 fw-bold text-white"
        [class]="claseBoton()"
        (click)="asignar($event)"
        [attr.aria-label]="ariaBoton()"
        [disabled]="!puedeAsignar()"
      >
        @if (puedeAsignar()) {
          Asignar a {{ gradoAsignado() }}
        } @else {
          Asignar
        }
      </button>
    } @else {
      <div class="dropdown" role="group" [attr.aria-label]="ariaGrupo()">
        <button
          class="btn btn-sm rounded-pill px-3 fw-bold text-white dropdown-toggle"
          [class]="claseBoton()"
          type="button"
          data-bs-toggle="dropdown"
          data-bs-display="static"
          aria-expanded="false"
          (click)="compartir($event)"
          [attr.aria-label]="ariaBoton()"
        >
          {{ textoBoton() }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item" [href]="enlaceWhatsapp()" target="_blank" rel="noopener">
              <i class="bi bi-whatsapp me-2" aria-hidden="true"></i>WhatsApp
            </a>
          </li>
          <li>
            <a class="dropdown-item" [href]="enlaceFacebook()" target="_blank" rel="noopener">
              <i class="bi bi-facebook me-2" aria-hidden="true"></i>Facebook
            </a>
          </li>
          <li>
            <a class="dropdown-item" [href]="enlaceTelegram()" target="_blank" rel="noopener">
              <i class="bi bi-telegram me-2" aria-hidden="true"></i>Telegram
            </a>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a
              class="dropdown-item"
              [href]="enlaceWhatsapp()"
              (click)="copiar($event)"
            >
              <i class="bi bi-copy me-2" aria-hidden="true"></i>Copiar enlace
            </a>
          </li>
        </ul>
      </div>
    }
  </div>
</a>
